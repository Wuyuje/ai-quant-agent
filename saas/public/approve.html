<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ARK - 跳转中...</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0d1117;color:#c9d1d9;font-family:-apple-system,BlinkMacSystemFont,sans-serif;display:flex;justify-content:center;align-items:center;min-height:100vh}
.box{text-align:center;padding:30px}
.spinner{display:inline-block;width:40px;height:40px;border:3px solid #30363d;border-top-color:#58a6ff;border-radius:50%;animation:spin .8s linear infinite;margin-bottom:16px}
@keyframes spin{to{transform:rotate(360deg)}}
h2{font-size:1.1em;margin-bottom:8px;color:#58a6ff}
p{color:#8b949e;font-size:.85em}
</style>
</head>
<body>
<div class="box">
  <div class="spinner"></div>
  <h2>正在跳转到仪表盘...</h2>
  <p>请在仪表盘内完成钱包授权</p>
</div>
<script>
// 强制跳转到 index.html 仪表盘
// 授权功能已集成在仪表盘内，不再使用独立 approve.html
// 保留 URL 中的 token 参数（如果有）
var token = new RegExp('[?&]token=([^&]+)').exec(window.location.search);
var target = 'index.html';
if (token) {
  target = 'index.html?token=' + encodeURIComponent(token[1]);
}
window.location.replace(target);
</script>
</body>
</html>
