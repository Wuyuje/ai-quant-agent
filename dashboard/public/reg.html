<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>ARK 登录</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,sans-serif;background:#0a0e17;color:#e0e0e0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
.c{background:#161b22;border:1px solid #21262d;border-radius:20px;padding:36px 24px;width:100%;max-width:420px;text-align:center}
.c h2{color:#58a6ff;margin-bottom:8px;font-size:1.4em}
.c .sub{color:#3fb950;font-size:.85em;margin-bottom:24px}
.f{margin-bottom:14px;text-align:left}
.f label{display:block;font-size:.8em;color:#8b949e;margin-bottom:4px}
.f input{width:100%;padding:13px 14px;font-size:16px;border:1px solid #30363d;border-radius:10px;background:#0d1117;color:#fff;outline:none}
.b{width:100%;padding:14px;font-size:16px;font-weight:700;border:none;border-radius:10px;cursor:pointer;margin-top:4px}
.bb{background:#1f6feb;color:#fff}
.sep{margin:20px 0;color:#30363d;font-size:.8em}
.bg{background:#238636;color:#fff}
pre{margin-top:12px;padding:8px;background:#0d1117;border:1px solid #21262d;border-radius:8px;font-size:10px;color:#8b949e;text-align:left;white-space:pre-wrap;word-break:break-all;max-height:200px;overflow:auto}
</style></head><body>
<div class="c">
  <h2>ARK Quant Agent</h2>
  <div class="sub">智能合约钱包 · 纯自动交易</div>
  
  <div class="f"><label>钱包地址</label><input type="text" id="a" placeholder="0x... (BSC 42位)"></div>
  <div class="f"><label>密码</label><input type="password" id="p" placeholder="至少6位"></div>
  <div class="f"><label>邀请码</label><input type="text" id="inv" placeholder="邀请码（联系管理员获取）"></div>
  
  <!-- 登录按钮在上面，最大最显眼 -->
  <button class="b bb" id="lb">登 录</button>
  
  <div class="sep">——— 还没有账号？ ———</div>
  
  <!-- 注册按钮在下面，绿色区分 -->
  <button class="b bg" id="rb">注册新账号</button>
  
  <pre id="log"></pre>
</div>

<script>
var L = document.getElementById('log');
function log(m) {
  var t = new Date().toLocaleTimeString();
  L.textContent = t + ' ' + m + '\n' + L.textContent;
}

log('ready');

function go(mode) {
  log(mode === 'login' ? '>>> 点了【登录】' : '>>> 点了【注册】');
  var a = document.getElementById('a').value.replace(/\s/g, '');
  var p = document.getElementById('p').value;
  
  if (!a || a.length < 10) { log('ERR: 地址太短'); return; }
  if (!/^0x/i.test(a)) { log('ERR: 地址必须0x开头'); return; }
  if (p.length < 6) { log('ERR: 密码至少6位'); return; }
  var inv = document.getElementById('inv').value.trim();
  if (mode === 'reg' && !inv) { log('ERR: 请输入邀请码'); return; }
  
  var url = mode === 'reg' ? '/api/auth/register' : '/api/auth/login';
  var body = mode === 'reg'
    ? { username: a.toLowerCase(), password: p, walletAddress: a.toLowerCase(), inviteCode: inv }
    : { username: a.toLowerCase(), password: p };
  
  log('POST ' + url);
  
  var xhr = new XMLHttpRequest();
  xhr.open('POST', url, true);
  xhr.setRequestHeader('Content-Type', 'application/json');
  xhr.timeout = 20000;
  xhr.onload = function() {
    log('[' + xhr.status + '] ' + xhr.responseText.substring(0, 200));
    try {
      var d = JSON.parse(xhr.responseText);
      if (d.success) {
        log('✅ 成功！跳转中...');
        localStorage.setItem('ark_token', d.token);
        localStorage.setItem('ark_user', JSON.stringify(d.user));
        setTimeout(function(){ location.href = '/'; }, 2000);
      } else {
        log('❌ ' + d.error);
      }
    } catch(e) { log('解析错误'); }
  };
  xhr.onerror = function() { log('❌ 网络错误'); };
  xhr.ontimeout = function() { log('❌ 超时'); };
  xhr.send(JSON.stringify(body));
  log('请求已发送');
}

// 登录 = lb（蓝色，上面那个）
document.getElementById('lb').onclick = function() { go('login'); };
// 注册 = rb（绿色，下面那个）
document.getElementById('rb').onclick = function() { go('reg'); };
log('按钮已绑定');
</script>
</body></html>
