<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MasterD Multi-Market Dashboard</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0a0e17;--card:#111827;--border:#1f2937;--accent:#3b82f6;--green:#22c55e;--red:#ef4444;--yellow:#f59e0b;--purple:#a855f7;--cyan:#06b6d4;--text:#f9fafb;--muted:#9ca3af}
body{font-family:'SF Pro','Inter',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
.header{background:linear-gradient(135deg,#0f172a,#1e1b4b);border-bottom:1px solid var(--border);padding:16px 24px;display:flex;justify-content:space-between;align-items:center}
.header h1{font-size:20px;background:linear-gradient(90deg,#3b82f6,#a855f7,#06b6d4);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.header .status{display:flex;gap:12px;align-items:center;font-size:13px}
.header .dot{width:8px;height:8px;border-radius:50%;background:var(--green);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.container{max-width:1400px;margin:0 auto;padding:16px}
.grid{display:grid;gap:16px}
.grid-2{grid-template-columns:repeat(2,1fr)}
.grid-3{grid-template-columns:repeat(3,1fr)}
.grid-5{grid-template-columns:repeat(5,1fr)}
@media(max-width:900px){.grid-2,.grid-3,.grid-5{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px;position:relative;overflow:hidden}
.card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px}
.card.crypto::before{background:linear-gradient(90deg,#f7931a,#f59e0b)}
.card.gold::before{background:linear-gradient(90deg,#ffd700,#f59e0b)}
.card.forex::before{background:linear-gradient(90deg,#3b82f6,#06b6d4)}
.card.index::before{background:linear-gradient(90deg,#a855f7,#ec4899)}
.card.arb::before{background:linear-gradient(90deg,#22c55e,#06b6d4)}
.card.signals::before{background:linear-gradient(90deg,#ef4444,#f59e0b)}
.card h3{font-size:14px;color:var(--muted);margin-bottom:12px;display:flex;align-items:center;gap:8px}
.card h3 .icon{font-size:18px}
.stat-row{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.05);font-size:13px}
.stat-row:last-child{border:none}
.stat-label{color:var(--muted)}
.stat-value{font-weight:600}
.stat-value.green{color:var(--green)}
.stat-value.red{color:var(--red)}
.stat-value.yellow{color:var(--yellow)}
.stat-value.cyan{color:var(--cyan)}
.stat-value.purple{color:var(--purple)}
.engine-bar{display:flex;align-items:center;gap:8px;margin:8px 0;padding:10px;background:rgba(255,255,255,.03);border-radius:8px}
.engine-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.engine-dot.active{background:var(--green);box-shadow:0 0 8px rgba(34,197,94,.5)}
.engine-dot.inactive{background:var(--red)}
.engine-info{flex:1}
.engine-name{font-size:13px;font-weight:600}
.engine-desc{font-size:11px;color:var(--muted)}
.engine-strats{font-size:11px;color:var(--cyan);background:rgba(6,182,212,.1);padding:2px 8px;border-radius:4px}
.pos-item{padding:8px;margin:4px 0;background:rgba(255,255,255,.03);border-radius:6px;font-size:12px}
.pos-header{display:flex;justify-content:space-between;margin-bottom:4px}
.pos-symbol{font-weight:700}
.pos-dir{padding:2px 6px;border-radius:3px;font-size:11px;font-weight:600}
.pos-dir.long{background:rgba(34,197,94,.15);color:var(--green)}
.pos-dir.short{background:rgba(239,68,68,.15);color:var(--red)}
.signal-item{padding:8px;margin:4px 0;border-radius:6px;font-size:12px;border-left:3px solid}
.signal-item.HIGH{background:rgba(239,68,68,.08);border-color:var(--red)}
.signal-item.MEDIUM{background:rgba(245,158,11,.08);border-color:var(--yellow)}
.signal-item.LOW{background:rgba(34,197,94,.08);border-color:var(--green)}
.signal-item.CRITICAL{background:rgba(168,85,247,.08);border-color:var(--purple)}
.summary-bar{display:flex;gap:16px;padding:12px 16px;background:var(--card);border:1px solid var(--border);border-radius:12px;margin-bottom:16px;flex-wrap:wrap}
.summary-item{text-align:center;flex:1;min-width:80px}
.summary-num{font-size:24px;font-weight:700}
.summary-label{font-size:11px;color:var(--muted)}
.tab-bar{display:flex;gap:4px;margin-bottom:16px;flex-wrap:wrap}
.tab{padding:8px 16px;border-radius:8px;background:var(--card);border:1px solid var(--border);cursor:pointer;font-size:13px;transition:all .2s}
.tab.active{background:var(--accent);border-color:var(--accent);color:white}
.tab:hover:not(.active){background:rgba(59,130,246,.1)}
.pnl-chart{height:200px;display:flex;align-items:flex-end;gap:2px;padding:8px 0}
.pnl-bar{flex:1;border-radius:3px 3px 0 0;min-height:4px;transition:height .3s}
.pnl-bar.profit{background:linear-gradient(to top,rgba(34,197,94,.6),var(--green))}
.pnl-bar.loss{background:linear-gradient(to top,var(--red),rgba(239,68,68,.6));border-radius:0 0 3px 3px;align-self:flex-start}
.footer{text-align:center;padding:24px;color:var(--muted);font-size:12px}
</style>
</head>
<body>
<div class="header">
  <h1>MasterD Multi-Market Dashboard v95</h1>
  <div class="status">
    <span class="dot"></span>
    <span id="engine-status">All Engines Online</span>
    <span style="color:var(--muted)" id="last-update"></span>
  </div>
</div>

<div class="container">
  <!-- 汇总栏 -->
  <div class="summary-bar" id="summary-bar">
    <div class="summary-item"><div class="summary-num cyan" id="total-engines">5</div><div class="summary-label">活跃引擎</div></div>
    <div class="summary-item"><div class="summary-num purple" id="total-strategies">41</div><div class="summary-label">总策略数</div></div>
    <div class="summary-item"><div class="summary-num green" id="total-positions">0</div><div class="summary-label">持仓总数</div></div>
    <div class="summary-item"><div class="summary-num" id="total-pnl">$0.00</div><div class="summary-label">总盈亏</div></div>
    <div class="summary-item"><div class="summary-num yellow" id="total-signals">0</div><div class="summary-label">活跃信号</div></div>
    <div class="summary-item"><div class="summary-num" id="arb-count">0</div><div class="summary-label">套利机会</div></div>
  </div>

  <!-- 引擎状态 + 跨市场信号 -->
  <div class="grid grid-2">
    <div class="card">
      <h3><span class="icon">⚙️</span> 引擎状态</h3>
      <div id="engines-list"></div>
    </div>
    <div class="card signals">
      <h3><span class="icon">⚡</span> 跨市场信号</h3>
      <div id="signals-list"><div style="color:var(--muted);font-size:13px;padding:16px;text-align:center">加载中...</div></div>
    </div>
  </div>

  <!-- 持仓面板 -->
  <div style="margin-top:16px">
    <div class="tab-bar">
      <div class="tab active" onclick="showTab('all')">全部持仓</div>
      <div class="tab" onclick="showTab('crypto')">Crypto</div>
      <div class="tab" onclick="showTab('gold')">Gold</div>
      <div class="tab" onclick="showTab('forex')">Forex</div>
      <div class="tab" onclick="showTab('index')">Index</div>
    </div>
    <div class="grid grid-2" id="positions-area"></div>
  </div>

  <!-- 套利机会 -->
  <div style="margin-top:16px">
    <div class="card arb">
      <h3><span class="icon">🔗</span> 跨市场套利机会</h3>
      <div id="arb-list"><div style="color:var(--muted);font-size:13px;padding:16px;text-align:center">加载中...</div></div>
    </div>
  </div>

  <!-- 回测结果 -->
  <div style="margin-top:16px">
    <div class="card">
      <h3><span class="icon">📊</span> 多币种回测结果 (30天, 5x杠杆, $100起)</h3>
      <div class="pnl-chart" id="backtest-chart"></div>
      <div id="backtest-table"></div>
    </div>
  </div>
</div>

<div class="footer">MasterD AI Quant Agent v95 — Multi-Market Full-Asset Trading Platform</div>

<script>
const API = window.location.origin;
let currentTab = 'all';
let allPositions = {};

async function fetchJSON(url) {
  try {
    const r = await fetch(url);
    return await r.json();
  } catch (e) { return null; }
}

function showTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.tab').forEach((t, i) => {
    t.classList.toggle('active', ['all','crypto','gold','forex','index'][i] === tab);
  });
  renderPositions(allPositions);
}

function renderEngines(data) {
  const el = document.getElementById('engines-list');
  if (!data || !data.engines) { el.innerHTML = '<div style="color:var(--muted)">无数据</div>'; return; }
  el.innerHTML = data.engines.map(e => `
    <div class="engine-bar">
      <div class="engine-dot active"></div>
      <div class="engine-info">
        <div class="engine-name">${e.name}</div>
        <div class="engine-desc">${e.desc}</div>
      </div>
      <div class="engine-strats">${e.strategies} 策略</div>
    </div>
  `).join('');
}

function renderSignals(data) {
  const el = document.getElementById('signals-list');
  if (!data || !data.activeSignals || data.activeSignals.length === 0) {
    el.innerHTML = '<div style="color:var(--muted);font-size:13px;padding:16px;text-align:center">✅ 无活跃信号 — 系统正常</div>';
    document.getElementById('total-signals').textContent = '0';
    return;
  }
  document.getElementById('total-signals').textContent = data.activeSignals.length;
  el.innerHTML = data.activeSignals.map(s => `
    <div class="signal-item ${s.severity || 'MEDIUM'}">
      <div style="font-weight:700">${s.name || s.id}</div>
      <div style="color:var(--muted);margin-top:2px">${s.severity || 'MEDIUM'} — ${new Date(s.time).toLocaleTimeString()}</div>
    </div>
  `).join('');

  // 历史信号
  if (data.signalHistory && data.signalHistory.length > 0) {
    el.innerHTML += '<div style="margin-top:12px;padding-top:8px;border-top:1px solid rgba(255,255,255,.1)"><div style="font-size:11px;color:var(--muted);margin-bottom:4px">最近历史</div>';
    el.innerHTML += data.signalHistory.slice(-5).reverse().map(h => `
      <div style="font-size:11px;padding:4px 0;color:var(--muted)">[${new Date(h.time).toLocaleTimeString()}] ${h.name}</div>
    `).join('');
    el.innerHTML += '</div>';
  }
}

function renderPositions(data) {
  const area = document.getElementById('positions-area');
  if (!data) { area.innerHTML = '<div class="card"><div style="color:var(--muted);padding:16px">加载中...</div></div>'; return; }
  allPositions = data;

  const markets = currentTab === 'all' ? ['crypto','gold','forex','index'] : [currentTab];
  const colors = { crypto: 'crypto', gold: 'gold', forex: 'forex', index: 'index' };
  const names = { crypto: '🪙 Crypto Futures', gold: '🏅 Gold Spot', forex: '💱 Forex', index: '📈 Index/ETF' };
  const icons = { crypto: '🪙', gold: '🏅', forex: '💱', index: '📈' };

  let html = '';
  let totalPos = 0;
  let totalPnl = 0;

  for (const m of markets) {
    const positions = data.positions?.[m] || [];
    totalPos += positions.length;
    
    html += `<div class="card ${colors[m]}">
      <h3><span class="icon">${icons[m]}</span> ${names[m]} (${positions.length})</h3>`;
    
    if (positions.length === 0) {
      html += '<div style="color:var(--muted);font-size:12px;padding:8px">暂无持仓</div>';
    } else {
      for (const p of positions) {
        const dir = (p.direction || 'LONG').toUpperCase();
        const pnl = p.pnl || p.unrealizedPnl || 0;
        totalPnl += pnl;
        const pnlPct = p.entryPrice ? ((dir === 'LONG' ? (p.currentPrice || p.entryPrice) - p.entryPrice : p.entryPrice - (p.currentPrice || p.entryPrice)) / p.entryPrice * 100) : 0;
        
        html += `<div class="pos-item">
          <div class="pos-header">
            <span class="pos-symbol">${p.symbol || 'N/A'}</span>
            <span class="pos-dir ${dir.toLowerCase()}">${dir} ${p.leverage || ''}</span>
          </div>
          <div style="display:flex;justify-content:space-between;font-size:11px;color:var(--muted)">
            <span>入场: $${(p.entryPrice || 0).toFixed(4)}</span>
            <span>数量: ${p.qty || p.amount || 0}</span>
          </div>
          <div style="display:flex;justify-content:space-between;font-size:11px;margin-top:4px">
            <span style="color:${pnl >= 0 ? 'var(--green)' : 'var(--red)'}">PnL: $${pnl.toFixed(4)}</span>
            ${p.strategies ? `<span style="color:var(--cyan)">${p.strategies.join('+')}</span>` : ''}
          </div>
        </div>`;
      }
    }
    html += '</div>';
  }

  document.getElementById('total-positions').textContent = totalPos;
  document.getElementById('total-pnl').textContent = `$${totalPnl.toFixed(2)}`;
  document.getElementById('total-pnl').className = `summary-num ${totalPnl >= 0 ? 'green' : 'red'}`;
  area.innerHTML = html;
}

function renderArb(data) {
  const el = document.getElementById('arb-list');
  if (!data || !data.opportunities || data.opportunities.length === 0) {
    el.innerHTML = '<div style="color:var(--muted);font-size:13px;padding:16px;text-align:center">暂无套利机会 — 扫描中...</div>';
    document.getElementById('arb-count').textContent = '0';
    return;
  }
  document.getElementById('arb-count').textContent = data.opportunities.length;
  el.innerHTML = '<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:8px">' + 
    data.opportunities.slice(-10).reverse().map(o => `
      <div class="pos-item">
        <div class="pos-header">
          <span class="pos-symbol">${o.type || o.pair || 'N/A'}</span>
          <span style="color:var(--green);font-size:12px">+${(o.profit * 100 || 0).toFixed(2)}%</span>
        </div>
        <div style="font-size:11px;color:var(--muted)">${o.desc || ''} — ${new Date(o.time).toLocaleTimeString()}</div>
      </div>
    `).join('') + '</div>';
}

function renderBacktest() {
  const chart = document.getElementById('backtest-chart');
  const table = document.getElementById('backtest-table');
  const data = [
    { coin: 'ETH', pnl: 5.47, winRate: 64.7, sharpe: 3.96, dd: -3.08 },
    { coin: 'BTC', pnl: 3.47, winRate: 73.7, sharpe: 3.64, dd: -2.25 },
    { coin: 'SOL', pnl: 1.63, winRate: 67.7, sharpe: 2.11, dd: -2.63 },
    { coin: 'BNB', pnl: -3.86, winRate: 58.1, sharpe: -3.77, dd: -4.24 },
  ];
  const maxAbs = Math.max(...data.map(d => Math.abs(d.pnl)));

  chart.innerHTML = data.map(d => {
    const h = Math.max(4, Math.abs(d.pnl) / maxAbs * 180);
    return `<div style="display:flex;flex-direction:column;align-items:center;flex:1">
      <div class="pnl-bar ${d.pnl >= 0 ? 'profit' : 'loss'}" style="height:${h}px;width:100%"></div>
      <div style="font-size:11px;margin-top:4px;font-weight:600;color:${d.pnl >= 0 ? 'var(--green)' : 'var(--red)'}">${d.pnl > 0 ? '+' : ''}${d.pnl}%</div>
      <div style="font-size:10px;color:var(--muted)">${d.coin}</div>
    </div>`;
  }).join('');

  table.innerHTML = `<table style="width:100%;font-size:12px;border-collapse:collapse;margin-top:8px">
    <tr style="color:var(--muted);border-bottom:1px solid var(--border)">
      <th style="text-align:left;padding:6px">币种</th><th style="text-align:right;padding:6px">收益</th><th style="text-align:right;padding:6px">胜率</th><th style="text-align:right;padding:6px">Sharpe</th><th style="text-align:right;padding:6px">最大回撤</th>
    </tr>
    ${data.map(d => `<tr style="border-bottom:1px solid rgba(255,255,255,.05)">
      <td style="padding:6px;font-weight:600">${d.coin}</td>
      <td style="text-align:right;padding:6px;color:${d.pnl >= 0 ? 'var(--green)' : 'var(--red)'}">${d.pnl > 0 ? '+' : ''}${d.pnl}%</td>
      <td style="text-align:right;padding:6px">${d.winRate}%</td>
      <td style="text-align:right;padding:6px;color:${d.sharpe > 0 ? 'var(--green)' : 'var(--red)'}">${d.sharpe}</td>
      <td style="text-align:right;padding:6px;color:var(--red)">${d.dd}%</td>
    </tr>`).join('')}
  </table>`;
}

async function refresh() {
  const [engines, signals, positions, arb] = await Promise.all([
    fetchJSON(API + '/api/multi-market/status'),
    fetchJSON(API + '/api/multi-market/signals'),
    fetchJSON(API + '/api/multi-market/all-positions'),
    fetchJSON(API + '/api/multi-market/arbitrage'),
  ]);
  renderEngines(engines);
  renderSignals(signals);
  renderPositions(positions);
  renderArb(arb);
  document.getElementById('last-update').textContent = new Date().toLocaleTimeString();
}

// 初始化
renderBacktest();
refresh();
setInterval(refresh, 15000);
</script>
</body>
</html>
