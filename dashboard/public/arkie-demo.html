<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Arkie 助手演示</title>
<style>
  body{margin:0;font-family:system-ui,-apple-system,"PingFang SC",sans-serif;background:#0a0e17;color:#e6edf3;min-height:100vh;display:flex;align-items:center;justify-content:center}
  .hero{text-align:center;padding:40px}
  .hero h1{font-size:32px;margin:0 0 12px;background:linear-gradient(135deg,#6366f1,#8b5cf6);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
  .hero p{color:#8b95a8;font-size:15px;line-height:1.7;max-width:520px;margin:0 auto 24px}
  .feat{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;max-width:560px;margin:0 auto}
  .feat span{padding:7px 14px;background:#161d2b;border:1px solid #232c3d;border-radius:20px;font-size:12.5px;color:#9aa8bd}
  .hint{margin-top:28px;color:#5a6779;font-size:12.5px}
</style>
</head>
<body>
  <div class="hero">
    <h1>Arkie 助手</h1>
    <p>MasterD 的儿子 · ARK 生态 AI 助手<br>点击右下角头像开始对话</p>
    <div class="feat">
      <span>🪙 ARK价格</span><span>💧 ARK池</span><span>📈 技术指标</span>
      <span>🔮 走势展望</span><span>💹 质押计算</span><span>👛 链上持仓</span>
      <span>🐋 鲸鱼监控</span><span>🔔 提醒订阅</span><span>🧠 多轮对话</span>
    </div>
    <div class="hint">按 Enter 发送 · 支持历史记录 · 全屏模式</div>
  </div>
  <script src="arkie-widget.js"></script>
</body>
</html>
