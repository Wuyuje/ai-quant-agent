<!DOCTYPE html><html lang=zh><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>BTC5 行情大屏</title>
<style>
 *{box-sizing:border-box;margin:0;padding:0;font-family:Segoe UI,system-ui,"PingFang SC",sans-serif}
 body{background:#03050b;color:#e7eefb;height:100vh;display:flex;flex-direction:column;padding:12px}
 header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:8px}
 h1{font-size:20px} .mut{color:#8fa0bf;font-size:12px}
 .bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;background:#0b1120;border:1px solid #1b2740;border-radius:12px;padding:10px 12px;margin-bottom:10px}
 .big{font-size:34px;font-weight:750}.up{color:#ff5a5a}.dn{color:#1fdd8b}
 .tag{font-size:12px;padding:3px 9px;border-radius:99px;background:#12203a;border:1px solid #1b2740;color:#8fa0bf}
 .btn{cursor:pointer;border:0;border-radius:8px;padding:7px 12px;font-weight:600;background:#16233b;color:#e7eefb}
 #kline{flex:1;width:100%;background:#05080f;border-radius:12px;border:1px solid #1b2740;cursor:grab;display:block}
</style></head><body>
<header><h1>BTC 5m Up/Down · 行情大屏</h1>
 <div><span class=tag id=live>…</span><span class=tag id=tfBtn>5m</span>
 <button class=btn id=vox>语音开</button> <button class="btn ghost" id="testVoice">测试语音</button>
 <button class=btn id=tfBtn1 onclick="setTf('5m')">5m</button>
 <button class=btn onclick="setTf('15m')">15m</button>
 <button class=btn onclick="setTf('1h')">1h</button></div></header>
<div class=bar>
 <div class=big id=dev>—</div>
 <span class=tag id=sig>—</span>
 <span>起始TWAP <b id=base>—</b></span><span>当前 <b id=last>—</b></span>
 <span>剩余 <b id=rem>—</b>s</span><span>轮 <b id=slug>—</b></span><span>ask <b id=ask>—</b></span>
</div>
<canvas id=kline width=1600 height=700></canvas>
<script>
 const $=id=>document.getElementById(id); let kdata=[],viewN=120,viewStart=0,tf='5m',voiceOn=false,lastSig='';
 function setTf(t){tf=t;$('tfBtn').textContent=t;drawK()}
 function drawK(){fetch('/api/klines?interval='+tf+'&limit=400').then(r=>r.json()).then(k=>{if(!Array.isArray(k)||k.length<30)return;kdata=k;viewN=Math.min(140,kdata.length);viewStart=Math.max(0,kdata.length-viewN);renderK()}).catch(()=>{})}
 function renderK(){const cv=$('kline');if(!cv)return;const g=cv.getContext('2d'),W=cv.width,H=cv.height;g.clearRect(0,0,W,H);
  const end=Math.min(viewStart+viewN,kdata.length),seg=kdata.slice(viewStart,end),n=seg.length;if(n<2)return;
  const c=seg.map(x=>x[4]);const hi=seg.map(x=>x[2]),lo=seg.map(x=>x[3]);let mn=Math.min(...lo),mx=Math.max(...hi);
  const up=[],dn=[],mid=[];
  for(let i=0;i<n;i++){if(i<19){up.push(null);dn.push(null);mid.push(null);continue}const s=c.slice(i-19,i+1),m=s.reduce((a,b)=>a+b,0)/20,sd=Math.sqrt(s.reduce((a,b)=>a+(b-m)*(b-m),0)/20);mid.push(m);up.push(m+2*sd);dn.push(m-2*sd)}
  const su=[];let atr=0,ub=null,db=null,dir=1;
  for(let i=0;i<n;i++){if(i===0){su.push(null);continue}const h=seg[i][2],l=seg[i][3],pc=c[i-1],tr=Math.max(h-l,Math.abs(h-pc),Math.abs(l-pc));atr=atr?((atr*9+tr)/10):tr;const hl=(h+l)/2;let u=hl+3*atr,d=hl-3*atr;if(ub!==null){u=(u<ub||pc>ub)?u:ub;d=(d>db||pc<db)?d:db}if(pc>ub)dir=1;else if(pc<db)dir=-1;ub=u;db=d;su.push(dir===1?db:u)}
  const all=c.concat(up.filter(Boolean)).concat(dn.filter(Boolean)).concat(su.filter(Boolean));mn=Math.min(mn,...all);mx=Math.max(mx,...all);const dd=mx-mn||1;
  const X=i=>i/(n-1)*(W-50)+6,Y=v=>H-(v-mn)/dd*(H-30)-12,bw=Math.max(2,(W-50)/n*0.65);
  seg.forEach((x,i)=>{const o=x[1],cl=x[4],h=x[2],l=x[3],upc=cl>=o;g.strokeStyle=g.fillStyle=upc?'#ff5a5a':'#1fdd8b';g.beginPath();g.moveTo(X(i),Y(h));g.lineTo(X(i),Y(l));g.stroke();const y1=Y(o),y2=Y(cl);g.fillRect(X(i)-bw/2,Math.min(y1,y2),bw,Math.max(1,Math.abs(y2-y1)))});
  const line=(arr,col)=>{g.strokeStyle=col;g.beginPath();let st=false;arr.forEach((v,i)=>{if(v==null){st=false;return}if(!st){g.moveTo(X(i),Y(v));st=true}else g.lineTo(X(i),Y(v))});g.stroke()};
  line(up,'#f4a340');line(mid,'#8fa0bf');line(dn,'#f4a340');line(su,'#1fdd8b');}
 $('kline').addEventListener('wheel',e=>{e.preventDefault();viewN=Math.max(20,Math.min(250,viewN+(e.deltaY>0?10:-10)));viewStart=Math.max(0,Math.min(kdata.length-viewN,viewStart));renderK()});
 let drag=null;$('kline').addEventListener('mousedown',e=>drag={x:e.clientX,s:viewStart});
 window.addEventListener('mousemove',e=>{if(drag){viewStart=Math.max(0,Math.min(kdata.length-viewN,drag.s-Math.round((e.clientX-drag.x)/7)));renderK()}});
 window.addEventListener('mouseup',()=>drag=null);
 $('testVoice').onclick=function(){speak('语音测试，声音正常');};
$('vox').onclick=()=>{voiceOn=!voiceOn;$('vox').textContent=voiceOn?'语音开':'语音关'};
 function speak(t){if(voiceOn&&'speechSynthesis'in window){const u=new SpeechSynthesisUtterance(t);u.lang='zh-CN';const vs=speechSynthesis.getVoices();const fav=['xiaoxiao','tingting','ting-ting','zh-CN-hunagYizeNeural'.replace('hunag','huang'),'Microsoft Yaoyao','Microsoft Xiaoxiao','zh-CN-XiaoxiaoNeural','zh-CN-XiaoyiNeural','zh-CN-YunxiNeural'.replace('Yunxi','Xiaoyi')];const v=vs.find(x=>/xiaoxiao|xiaoyi|yaoyao|tingting/i.test(x.name))||vs.find(x=>x.lang&&x.lang.startsWith('zh'))||vs[0];if(v)u.voice=v;speechSynthesis.cancel();speechSynthesis.speak(u);if(speechSynthesis.getVoices().length===0){speechSynthesis.onvoiceschanged=()=>{}}}}
 function ref(){fetch('/api/twap').then(r=>r.json()).then(s=>{if(!s||!s.ts)return;
  $('dev').textContent=(s.dev>0?'+':'')+s.dev+'%';$('dev').className='big '+(s.dev>0?'up':'dn');
  $('base').textContent=s.base;$('last').textContent=s.last;$('rem').textContent=s.remain??'-';$('slug').textContent=s.round&&s.round.slug||'-';$('ask').textContent=(s.round&&s.round.ask)||'-';$('sig').textContent=s.signal||'-';
  if(s.signal&&s.signal!=='观察'&&s.signal!==lastSig){speak('建议买'+(s.signal==='UP'?'涨':'跌'));lastSig=s.signal;}});
  fetch('/api/state').then(r=>r.json()).then(d=>{$('live').textContent='系统:'+(d.runner.enabled?'运行中':'停止')});}
 setInterval(ref,2000);setInterval(drawK,12000);ref();drawK();
</script></body></html>
