version: "3.8"
services:
  ark-tools:
    build: .
    container_name: ark-citizen-tools
    restart: unless-stopped
    ports:
      - "18080:18080"
    environment:
      - PORT=18080
      - TZ=Asia/Shanghai
    volumes:
      - ./state:/app/state
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:18080/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
