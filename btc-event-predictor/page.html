<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BTC 事件预测 · 专业模拟盘</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter','Segoe UI',sans-serif}
:root{--bg:#0b0f17;--panel:#111827;--line:#1f2937;--txt:#e5e7eb;--mut:#9ca3af;--green:#10b981;--red:#ef4444;--gold:#f59e0b}
body{background:var(--bg);color:var(--txt);min-height:100vh}
.hdr{background:#141b2d;border-bottom:1px solid var(--line);padding:16px 28px;display:flex;justify-content:space-between;align-items:center}
.brand{display:flex;gap:12px;align-items:center}
.logo{width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,#f59e0b,#ef4444);display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff}
.brand h1{font-size:19px}.brand p{font-size:12px;color:var(--mut)}
.pill{background:rgba(16,185,129,.12);color:var(--green);border:1px solid rgba(16,185,129,.25);padding:6px 14px;border-radius:20px;font-size:12.5px}
.wrap{max-width:1280px;margin:0 auto;padding:24px 28px}
.quote{background:linear-gradient(135deg,#141b2d,#1a2440);border:1px solid var(--line);border-radius:16px;padding:22px 26px;margin-bottom:20px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:20px}
.q-lbl{font-size:12px;color:var(--mut);margin-bottom:6px;text-transform:uppercase}
.q-price{font-size:36px;font-weight:800;font-variant-numeric:tabular-nums}
.up{color:var(--green)}.dn{color:var(--red)}.gold{color:var(--gold)}
.q-pred{font-size:22px;font-weight:800}.q-conf{font-size:13px;color:var(--mut);margin-top:4px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:16px;margin-bottom:20px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px}
.card .k{font-size:12px;color:var(--mut)}.card .v{font-size:26px;font-weight:800;margin-top:8px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:20px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px}
.panel h3{font-size:14px;color:var(--mut);margin-bottom:12px}
.chart{height:230px}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{color:var(--mut);text-align:left;padding:10px;border-bottom:1px solid var(--line);font-size:12px}
.tbl td{padding:10px;border-bottom:1px solid #182134}
.bind{margin-top:12px;display:flex;gap:10px;flex-wrap:wrap}
.bind input{background:var(--bg);border:1px solid var(--line);color:var(--txt);padding:10px;border-radius:8px;width:220px}
.bind button{background:var(--gold);color:#0b0f17;border:0;padding:10px 22px;border-radius:8px;font-weight:700;cursor:pointer}
</style></head><body>
<div class="hdr"><div class="brand"><div class="logo">₿</div><div><h1>BTC 事件预测 · 专业模拟盘</h1><p>10分钟涨跌预测 · 虚拟资金</p></div></div><span class="pill">🟢 模拟运行（非实盘）</span></div>
<div class="wrap">
<div class="quote">
  <div><div class="q-lbl">BTC/USDT</div><div class="q-price" id="price">--</div></div>
  <div><div class="q-lbl">10分钟预测</div><div class="q-pred" id="pred">--</div><div class="q-conf" id="conf"></div></div>
  <div><div class="q-lbl">仓位</div><div class="q-pred" id="pos">--</div></div>
</div>
<div class="cards">
  <div class="card"><div class="k">用户数</div><div class="v" id="c1">--</div></div>
  <div class="card"><div class="k">累计交易</div><div class="v gold" id="c2">--</div></div>
  <div class="card"><div class="k">平均胜率</div><div class="v up" id="c3">--</div></div>
  <div class="card"><div class="k">最高余额</div><div class="v" id="c4">--</div></div>
</div>
<div class="grid">
  <div class="panel"><h3>📈 用户资金曲线</h3><div class="chart"><canvas id="eq"></canvas></div></div>
  <div class="panel"><h3>📊 用户盈亏</h3><div class="chart"><canvas id="wr"></canvas></div></div>
</div>
<div class="grid">
  <div class="panel"><h3>🏆 模拟资金排行</h3><table class="tbl"><thead><tr><th>用户</th><th>角色</th><th>余额</th><th>盈亏</th><th>胜率</th></tr></thead><tbody id="rank"></tbody></table></div>
  <div class="panel"><h3>📜 最近交易</h3><table class="tbl"><thead><tr><th>方向</th><th>开→平</th><th>结果</th></tr></thead><tbody id="trd"></tbody></table></div>
</div>
<div class="panel"><h3>⚙️ 绑定币安 API Key（模拟盘不实盘）</h3>
<div class="bind"><input id="apikey" placeholder="API Key"><input id="secret" placeholder="Secret"><button onclick="bindKey()">确认绑定</button></div>
<div id="bindMsg" style="margin-top:10px;font-size:13px;color:var(--mut)"></div></div>
</div>
<script>
let eqC=null,wrC=null;
function load(){
  fetch('/api/sim').then(r=>r.json()).then(d=>{
    document.getElementById('price').textContent=d.price?Number(d.price).toFixed(1):'--';
    const pred=d.pred, up=pred&&pred.prob>0.5;
    const pe=document.getElementById('pred');
    pe.textContent=pred?(up?'上涨 '+(pred.prob*100).toFixed(0)+'%':'下跌 '+((1-pred.prob)*100).toFixed(0)+'%'):'等待';
    pe.className='q-pred '+(up?'up':'dn');
    document.getElementById('conf').textContent=pred?('置信度 '+Math.abs(pred.prob-0.5).toFixed(2)):'';
    const op=d.open;
    document.getElementById('pos').textContent=op?(op.side+' @'+Number(op.base).toFixed(1)):'空闲';
    document.getElementById('c1').textContent=d.users.length;
    document.getElementById('c2').textContent=(d.trades||[]).length;
    const wrArr=d.users.filter(u=>(u.wins+u.losses)>0);
    document.getElementById('c3').textContent=wrArr.length?Math.round(wrArr.reduce((a,u)=>a+u.wr,0)/wrArr.length)+'%':'--';
    const top=[...d.users].sort((a,b)=>b.balance-a.balance)[0];
    document.getElementById('c4').textContent=top?('$'+top.balance.toFixed(1)):'--';
    const rankRole={'管理员':0,'白名单':1,'用户':2};
    d.users.sort((a,b)=>(rankRole[a.role]??2)-(rankRole[b.role]??2)||(b.balance-a.balance));
    document.getElementById('rank').innerHTML=d.users.map(u=>`<tr><td>${u.wallet}</td><td>${u.role}</td><td class="gold">${u.balance.toFixed(1)}</td><td class="${u.pnl>=0?'up':'dn'}">${u.pnl>=0?'+':''}${u.pnl.toFixed(1)}</td><td class="${u.wr>=50?'up':'dn'}">${u.wr}%</td></tr>`).join('');
    document.getElementById('trd').innerHTML=(d.trades||[]).slice().reverse().map(x=>`<tr><td class="${x.side==='LONG'?'up':'dn'}">${x.side}</td><td>${Number(x.base).toFixed(1)}→${Number(x.close).toFixed(1)}</td><td class="${x.win?'up':'dn'}">${x.win?'✓':'✗'} ${x.result>0?'+':''}${x.result.toFixed(1)}</td></tr>`).join('');
    // 图表
    if(d.users[0]&&d.users[0].curve){
      if(!eqC){
        eqC=new Chart(document.getElementById('eq'),{type:'line',data:{labels:d.users[0].curve.map((_,i)=>i),datasets:d.users.map((u,i)=>({label:'U'+(i+1),data:u.curve,borderColor:['#10b981','#3b82f6','#f59e0b','#ef4444','#14b8a6','#8b5cf6','#ec4899'][i%7],borderWidth:2,fill:false,tension:.3}))},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{labels:{color:'#9ca3af'}}},scales:{y:{ticks:{color:'#6b7280'}},x:{ticks:{color:'#6b7280'}}}}});
      }else{eqC.data.datasets=d.users.map((u,i)=>({label:'U'+(i+1),data:u.curve,borderColor:['#10b981','#3b82f6','#f59e0b','#ef4444','#14b8a6','#8b5cf6','#ec4899'][i%7],borderWidth:2,fill:false,tension:.3}));eqC.update();}
      if(!wrC){
        wrC=new Chart(document.getElementById('wr'),{type:'bar',data:{labels:d.users.map(u=>u.wallet),datasets:[{label:'盈亏',data:d.users.map(u=>u.pnl),backgroundColor:d.users.map(u=>u.pnl>=0?'#10b981':'#ef4444')}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{y:{ticks:{color:'#6b7280'}}}}});
      }else{wrC.data.datasets[0].data=d.users.map(u=>u.pnl);wrC.update();}
    }
  }).catch(()=>{});
}
function bindKey(){const k=document.getElementById('apikey').value.trim(),s=document.getElementById('secret').value.trim();if(!k||!s){document.getElementById('bindMsg').textContent='⚠️ 请填写 Key 与 Secret';return;}fetch('/api/bind',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({key:k,secret:s})}).then(r=>r.json()).then(x=>{document.getElementById('bindMsg').textContent=x.msg;document.getElementById('apikey').value='';document.getElementById('secret').value='';});}
load();setInterval(load,5000);
</script></body></html>
